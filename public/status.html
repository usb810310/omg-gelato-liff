<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OMG Gelato｜營業公告</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js"
      }
    }
  </script>
  <style>
    :root {
      --ink: #f4ece8;
      --plum: #f1e5df;
      --plum-2: #d8bdce;
      --cream: #29263f;
      --paper: #37314d;
      --muted: #ab9ea9;
      --line: rgba(255, 255, 255, .12);
      --lime: #d9eea7;
      --coral: #f29b7d;
      --green: #9ecb83;
      --shadow: 0 18px 45px rgba(0, 0, 0, .34);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% -10%, #574263 0, var(--cream) 44%); color: var(--ink); }
    body { padding: 14px 14px 28px; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif; }
    button, a { font: inherit; }
    .page { width: min(100%, 440px); margin: 0 auto; }

    .hero-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .hero-meta-label { margin: 0; color: rgba(255,250,242,.62); font-size: 9px; font-weight: 800; letter-spacing: .15em; }
    .live-dot { display: inline-flex; align-items: center; gap: 6px; color: var(--plum-2); font-size: 10px; font-weight: 750; }
    .live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(158, 203, 131, .22); }

    .hero { position: relative; min-height: 148px; overflow: hidden; padding: 19px 19px 17px; border: 1px solid rgba(242, 155, 125, .22); border-radius: 20px; color: #fffaf2; background: #49304e; box-shadow: var(--shadow), 0 0 25px rgba(190, 133, 178, .1), inset 0 1px 0 rgba(255,255,255,.12); }
    .hero::before { content: ""; position: absolute; width: 220px; height: 220px; right: -75px; top: -58px; border-radius: 50%; background: var(--coral); opacity: .9; }
    .hero::after { content: ""; position: absolute; width: 170px; height: 170px; right: -32px; bottom: -78px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); box-shadow: 0 0 0 22px rgba(255,255,255,.05), 0 0 0 44px rgba(255,255,255,.04); }
    .hero-content { position: relative; z-index: 1; }
    .hero-kicker { margin: 0; color: var(--lime); font-size: 10px; font-weight: 850; letter-spacing: .2em; }
    .hero h1 { max-width: 285px; margin: 0 0 7px; font-size: clamp(29px, 9vw, 40px); line-height: .98; letter-spacing: -.08em; }
    .hero-detail { max-width: 255px; margin: 0; color: rgba(255,250,242,.72); font-size: 10px; line-height: 1.45; }
    .hero-time { display: inline-flex; align-items: center; gap: 8px; margin-top: 11px; padding: 7px 10px; border: 1px solid rgba(255,255,255,.17); border-radius: 999px; background: rgba(255,255,255,.08); color: #fff; font-size: 10px; font-weight: 700; }
    .hero-time i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); }
    .hero.closed .hero-kicker { color: #ffd1bd; }
    .hero.closed .hero-time i { background: var(--coral); }
    .announcement { margin-top: 12px; padding: 15px 16px; border: 1px solid rgba(242, 155, 125, .25); border-radius: 16px; background: linear-gradient(135deg, #44334f, #3a304b); box-shadow: 0 7px 22px rgba(0, 0, 0, .2), inset 0 1px 0 rgba(255,255,255,.08); }
    .announcement-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .announcement-label { color: #f5c5ad; font-size: 9px; font-weight: 850; letter-spacing: .16em; }
    .announcement-badge { padding: 4px 8px; border-radius: 999px; color: #d9eea7; background: rgba(217,238,167,.1); font-size: 8px; font-weight: 800; }
    .announcement h2 { margin: 0; color: #fff8f1; font-size: 15px; letter-spacing: -.03em; }
    .announcement p { margin: 6px 0 0; color: rgba(255,248,241,.63); font-size: 10px; line-height: 1.5; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .info-card { min-height: 126px; padding: 15px; border: 1px solid rgba(216, 189, 206, .13); border-radius: 16px; background: var(--paper); box-shadow: 0 7px 22px rgba(0, 0, 0, .2), 0 0 18px rgba(158, 203, 131, .035), inset 0 1px 0 rgba(255,255,255,.06); }
    .info-label { display: block; margin-bottom: 12px; color: var(--muted); font-size: 9px; font-weight: 800; letter-spacing: .13em; }
    .info-value { display: block; color: var(--plum); font-size: clamp(11px, 3.2vw, 15px); font-weight: 850; line-height: 1.35; letter-spacing: -.06em; white-space: nowrap; }
    .info-note { margin: 8px 0 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
    .payment-copy { margin: 0 0 11px; color: var(--plum); font-size: clamp(9px, 2.7vw, 11px); font-weight: 750; line-height: 1.45; letter-spacing: -.04em; white-space: nowrap; }
    .payment-icons { display: flex; align-items: center; gap: 7px; }
    .payment-icon-box { display: grid; place-items: center; width: 64px; height: 34px; border: 1px solid rgba(216, 189, 206, .16); border-radius: 8px; background: #45405b; box-shadow: inset 0 1px 0 rgba(255,255,255,.08); }
    .payment-icon-box img { width: 56px; height: 27px; object-fit: contain; }

    .section-label { display: flex; align-items: center; justify-content: space-between; margin: 25px 3px 10px; }
    .section-label h2 { margin: 0; color: var(--plum); font-size: 15px; letter-spacing: -.03em; }
    .section-label span { color: var(--muted); font-size: 9px; letter-spacing: .08em; }

    .footer-note { margin: 23px 8px 0; color: var(--muted); font-size: 9px; line-height: 1.6; text-align: center; }
    .refresh { display: block; width: 100%; margin-top: 15px; padding: 12px; border: 0; border-radius: 999px; color: var(--plum); background: rgba(255,255,255,.1); font-size: 11px; font-weight: 800; cursor: pointer; }
    .error { margin: 10px 0 0; color: #b15e4c; font-size: 10px; text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 340px) { .hero { min-height: 265px; padding: 22px 18px; } .hero h1 { font-size: 43px; } .schedule-time { width: 84px; font-size: 9px; } }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero" id="hero">
      <div class="hero-content">
        <div class="hero-meta"><p class="hero-meta-label">STORE STATUS</p><div class="live-dot"><i></i><span id="syncText">即時同步</span></div></div>
        <p class="hero-kicker" id="heroKicker">OPEN TODAY</p>
        <h1 id="statusLabel">目前營業中</h1>
        <p class="hero-detail" id="statusDetail">歡迎來店享用今日義式冰淇淋。</p>
        <div class="hero-time"><i></i><span id="todayHours">星期六 · 14:00 – 20:00</span></div>
      </div>
    </section>

    <section class="announcement" aria-live="polite">
      <div class="announcement-head"><span class="announcement-label">ANNOUNCEMENT</span><span class="announcement-badge">最新公告</span></div>
      <h2 id="announcementTitle">目前沒有任何公告</h2>
      <p id="announcementDetail">若有臨時休息或特殊安排，會在這裡更新。</p>
    </section>

    <section class="info-grid" aria-label="今日資訊">
      <article class="info-card">
        <span class="info-label">今日營業</span>
        <strong class="info-value" id="infoTodayHours">星期六 · 14:00 – 20:00</strong>
        <p class="info-note">歡迎來店享用義式冰淇淋</p>
      </article>
      <article class="info-card">
        <span class="info-label">付款方式</span>
        <p class="payment-copy">門市接受現金、LINE Pay 付款</p>
        <div class="payment-icons">
          <span class="payment-icon-box"><img src="cash.svg" alt="現金" /></span>
          <span class="payment-icon-box"><img src="line-pay.png" alt="LINE Pay" /></span>
        </div>
      </article>
    </section>

    <button class="refresh" type="button" id="refreshButton">重新整理營業狀態</button>
    <p class="error" id="errorText" hidden>目前無法同步最新資料，請稍後再試。</p>
    <p class="footer-note">營業時間與店家現場狀況可能有所調整，最新狀態以本頁公告為準。</p>
  </main>

  <script type="module">
    import { initializeApp, getApp, getApps } from 'firebase/app';
    import { getDatabase, ref, onValue } from 'firebase/database';

    const firebaseConfig = {
      apiKey: 'AIzaSyDvzZKr2x3TGeOFZGisKKXjbYH00DLVhKg',
      authDomain: 'omg-menu-5761a.firebaseapp.com',
      databaseURL: 'https://omg-menu-5761a-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'omg-menu-5761a',
      storageBucket: 'omg-menu-5761a.firebasestorage.app',
      messagingSenderId: '193209930119',
      appId: '1:193209930119:web:d9216165be9ef6c0bcc322'
    };
    const db = getDatabase(getApps().length ? getApp() : initializeApp(firebaseConfig));
    const $ = (id) => document.getElementById(id);
    const dayNames = { sun:'星期日', mon:'星期一', tue:'星期二', wed:'星期三', thu:'星期四', fri:'星期五', sat:'星期六' };
    const defaultHours = { open:true, start:'14:00', end:'20:00' };

    function taipeiParts(date) {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Taipei', weekday:'short', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(date);
      const get = (type) => parts.find((part) => part.type === type)?.value || '0';
      return { key:get('weekday').toLowerCase().slice(0,3), minutes:Number(get('hour')) * 60 + Number(get('minute')) };
    }
    function toMinutes(value) { const [h, m] = String(value || '0:0').split(':').map(Number); return h * 60 + m; }
    function currentStatus(hours) {
      const now = taipeiParts(new Date()), today = { ...defaultHours, ...(hours?.[now.key] || {}) }, mode = hours?.shopMode || (hours?.shopClosed ? 'off' : 'auto');
      if (mode === 'off') return { open:false, label:'店休中', kicker:'CLOSED TODAY', detail:'目前店休中，線上點餐暫停。', today };
      const open = mode === 'open' || (mode === 'auto' && today.open && now.minutes >= toMinutes(today.start) && now.minutes < toMinutes(today.end));
      if (open) return { open:true, label:'目前營業中', kicker:'OPEN TODAY', detail:'歡迎來店享用今日義式冰淇淋。', today };
      if (!today.open) return { open:false, label:'今日店休', kicker:'CLOSED TODAY', detail:'今天沒有安排營業，歡迎改天再來。', today };
      return { open:false, label:now.minutes < toMinutes(today.start) ? '尚未營業' : '今日已打烊', kicker:'CLOSED FOR NOW', detail:`今日營業時間為 ${today.start} – ${today.end}`, today };
    }
    function render(hours) {
      const nowKey = taipeiParts(new Date()).key, result = currentStatus(hours), today = result.today;
      $('hero').classList.toggle('closed', !result.open);
      $('heroKicker').textContent = result.kicker;
      $('statusLabel').textContent = result.label;
      $('statusDetail').textContent = result.detail;
      const todayText = `${dayNames[nowKey]} · ${today.open === false ? '店休' : `${today.start} – ${today.end}`}`;
      $('todayHours').textContent = todayText;
      $('infoTodayHours').textContent = `${dayNames[nowKey]} · ${today.open === false ? '店休' : `${today.start} – ${today.end}`}`;
    }
    function setSync(state, text) {
      $('syncText').textContent = text;
      document.querySelector('.live-dot i').style.background = state === 'online' ? 'var(--green)' : 'var(--coral)';
    }
    function renderAnnouncement(data) {
      const announcements = Object.values(data || {})
        .filter((item) => item && typeof item === 'object' && item.active !== false)
        .sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0));
      const latest = announcements[0];
      $('announcementTitle').textContent = latest?.title || '目前沒有任何公告';
      $('announcementDetail').textContent = latest
        ? (latest.content || '若有臨時休息或特殊安排，會在這裡更新。')
        : '若有臨時休息或特殊安排，會在這裡更新。';
    }
    onValue(ref(db, 'announcements'), (snap) => {
      renderAnnouncement(snap.val());
      $('errorText').hidden = true;
    }, () => {
      $('announcementTitle').textContent = '公告同步中斷';
      $('announcementDetail').textContent = '目前無法同步最新公告，請稍後再試。';
      $('errorText').hidden = false;
    });
    function bindOnce() {
      onValue(ref(db, 'businessHours'), (snap) => { render(snap.val()); $('errorText').hidden = true; setSync('online', '即時同步'); }, () => { $('errorText').hidden = false; setSync('offline', '同步中斷'); }, { onlyOnce:true });
    }
    onValue(ref(db, 'businessHours'), (snap) => { render(snap.val()); $('errorText').hidden = true; setSync('online', '即時同步'); }, () => { $('errorText').hidden = false; setSync('offline', '同步中斷'); });
    $('refreshButton').addEventListener('click', bindOnce);
    setInterval(bindOnce, 30000);
  </script>
</body>
</html>
