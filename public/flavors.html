<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f2ec" />
  <title>OMG! Gelato 今日口味</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js"
      }
    }
  </script>
  <script src="/business-hours-rules.js?v=20261116-2"></script>
  <style>

    :root { --bg:#f7f2ec; --card:#fffdf9; --ink:#30251f; --muted:#8b7c71; --line:#eadfd5; --accent:#a36d4f; --ok-bg:#edf7ee; --ok:#39734a; --closed-bg:#fff2eb; --closed:#9a5a45; --sold-bg:#f1eeeb; --sold:#9a8e85; }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); }
    body { font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif; padding:14px 12px 20px; }
    .shell { width:min(100%,420px); margin:0 auto; }
    .brand { display:flex; align-items:center; gap:8px; min-width:0; }
    .logo { width:26px; height:26px; object-fit:contain; border-radius:8px; background:#fff; box-shadow:0 2px 8px rgba(79,55,39,.08); }
    .brand-copy { min-width:0; }
    .brand-title { margin:0; color:var(--ink); font-size:12px; line-height:1.1; letter-spacing:.1px; }
    .brand-subtitle { margin-top:2px; color:var(--muted); font-size:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sync { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:9px; white-space:nowrap; }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:#e3af55; }
    .sync-dot.online { background:#4fa563; box-shadow:0 0 0 3px rgba(79,165,99,.12); }
    .sync-dot.offline { background:#d66b59; }
    .status { position: relative; display: block; margin-bottom: 13px; padding: 17px 17px 15px; border: 1px solid #cfe4d2; border-radius: 19px; background: linear-gradient(135deg, #f1fbf1 0%, #e5f3e6 100%); color: var(--ok); box-shadow: 0 9px 22px rgba(73, 117, 71, .10); overflow: hidden; }
    .status::after { content: ""; position: absolute; width: 118px; height: 118px; right: -35px; top: -46px; border-radius: 50%; background: rgba(79, 165, 99, .11); pointer-events: none; }
    .status.closed { border-color: #efd4c9; background: linear-gradient(135deg, #fff7f1 0%, #fbe8df 100%); color: var(--closed); box-shadow: 0 9px 22px rgba(163, 91, 67, .09); }
    .status.closed::after { background: rgba(214, 107, 89, .11); }
    .status.loading { border-color: #ead9b4; background: linear-gradient(135deg, #fffaf0 0%, #f8efd9 100%); color: #a66f1d; box-shadow: 0 9px 22px rgba(166, 111, 29, .08); }
    .status.loading::after { background: rgba(227, 175, 85, .13); }
    .status.loading .status-dot { box-shadow: 0 0 0 5px rgba(227, 175, 85, .14); }
    .status.loading .status-time { border-color: rgba(166, 111, 29, .16); color: #94651f; }
    .status-brand-row { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 11px; border-bottom: 1px solid rgba(73, 117, 71, .14); }
    .status-top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; }
    .status-kicker { display: flex; align-items: center; gap: 7px; color: currentColor; font-size: 10px; font-weight: 900; letter-spacing: .12em; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 5px rgba(79, 165, 99, .13); }
    .status.closed .status-dot { box-shadow: 0 0 0 5px rgba(214, 107, 89, .13); }
    .status-main { position: relative; z-index: 1; margin: 8px 0 3px; color: var(--ink); font-size: 24px; font-weight: 900; line-height: 1.15; letter-spacing: -.06em; }
    .status-detail { position: relative; z-index: 1; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
    .status-time { position: relative; z-index: 1; display: inline-flex; margin-top: 11px; padding: 7px 10px; border: 1px solid rgba(69, 112, 72, .15); border-radius: 999px; color: #47704a; background: rgba(255,255,255,.58); font-size: 10px; font-weight: 800; }
    .status.closed .status-time { border-color: rgba(154, 90, 69, .16); color: var(--closed); }
    .section { padding:14px 12px 12px; border:1px solid var(--line); border-radius:18px; background:var(--card); box-shadow:0 8px 22px rgba(73,48,32,.06); }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin:0 2px 10px; }
    .section-head h2 { margin:0; font-size:15px; letter-spacing:.1px; }
    .section-head span { color:var(--muted); font-size:10px; }
    .flavor-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .flavor-card { position:relative; min-height:58px; padding:12px 9px 10px 13px; overflow:hidden; border:1px solid var(--line); border-radius:13px; background:#fffdfb; }
    .flavor-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--flavor,var(--accent)); }
    .flavor-card.sold { background:var(--sold-bg); color:var(--sold); }
    .flavor-card.sold::before { background:#c9c0b9; }
    .flavor-name { padding-right:2px; font-size:13px; font-weight:800; line-height:1.25; }
    .flavor-desc { margin-top:4px; color:var(--muted); font-size:10px; line-height:1.35; }
    .badge { position:absolute; top:7px; right:7px; padding:2px 5px; border-radius:999px; background:#e5dfda; color:var(--sold); font-size:8px; font-weight:700; }
    .empty { grid-column:1/-1; padding:24px 8px; color:var(--muted); text-align:center; font-size:12px; }
    .note { margin:10px 3px 0; color:var(--muted); font-size:10px; line-height:1.4; text-align:center; }
    .updated { margin-top:6px; color:#aa9b90; font-size:9px; text-align:center; }
    @media (max-width:330px) { body { padding:11px 9px 16px; } .brand-title { font-size:14px; } .flavor-card { min-height:53px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="status loading" id="shopStatus" aria-live="polite">
      <div class="status-brand-row">
        <div class="brand">
          <img class="logo" src="https://omg-gelato79.pages.dev/logo1.png" alt="OMG! Gelato" onerror="this.style.display='none'" />
          <div class="brand-copy">
            <h1 class="brand-title" id="brandTitle">OMG! Gelato</h1>
            <div class="brand-subtitle" id="brandSubtitle">今日口味・快速查看</div>
          </div>
        </div>
        <div class="sync"><i class="sync-dot" id="syncDot"></i><span id="syncText">連線中</span></div>
      </div>
      <div class="status-top"><span class="status-kicker"><i class="status-dot"></i>今日營業狀態</span><span class="sync" id="statusDate">—</span></div>
      <strong class="status-main" id="statusLabel">正在同步狀態</strong>
      <p class="status-detail" id="statusDetail">尚未取得 POS 最新營業設定，請稍候。</p>
      <span class="status-time" id="statusTime">資料同步中</span>
    </section>

    <section class="section">
      <div class="section-head"><h2>今天有哪些口味？</h2><span id="flavorCount">載入中</span></div>
      <div class="flavor-grid" id="flavorGrid"><div class="empty">正在同步今日口味…</div></div>
    </section>

    <p class="note">口味與供應數量會依店內現場為準</p>
    <div class="updated" id="updatedAt">最後同步：—</div>
  </main>

  <script type="module">
    import { initializeApp, getApp, getApps } from 'firebase/app';
    import { getDatabase, ref, onValue } from 'firebase/database';

    const firebaseConfig = {
      apiKey: 'AIzaSyDvzZKr2x3TGeOFZGisKKXjbYH00DLVhKg',
      authDomain: 'omg-menu-5761a.firebaseapp.com',
      databaseURL: 'https://omg-menu-5761a-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'omg-menu-5761a',
      storageBucket: 'omg-menu-5761a.firebasestorage.app',
      messagingSenderId: '193209930119',
      appId: '1:193209930119:web:d9216165be9ef6c0bcc322'
    };
    const db = getDatabase(getApps().length ? getApp() : initializeApp(firebaseConfig));
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const colors = { '開心果':'#8CB872', '草莓':'#E8837A', '巧克力':'#8D7A6D', '芒果':'#F5C542', '抹茶':'#89B87C', '香草':'#F5E6D3', '咖啡':'#B5957A', '檸檬':'#F5E56B', '覆盆子':'#E8707A', '百香果':'#F5B84D', '藍莓':'#7A8FC9', '芋頭牛奶':'#C9A8D0', '烏龍茶':'#A09080', '紅茶':'#C4B0A0', '黑金芝麻':'#4A3A30' };
    const rules = window.GelatoBusinessHours;
    const dayNames = { sun:'星期日', mon:'星期一', tue:'星期二', wed:'星期三', thu:'星期四', fri:'星期五', sat:'星期六' };
    function setSync(state, text) { $('syncDot').className = `sync-dot ${state}`; $('syncText').textContent = text; $('updatedAt').textContent = `最後同步：${new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' })}`; }
    function formatToday(dateKey) {
      const p = rules.taipeiParts(new Date(`${dateKey}T12:00:00+08:00`));
      return `${p.month}月${p.day}日 ${dayNames[p.dayKey] || ''}`;
    }
    function updateStatus(hours) {
      const status = $('shopStatus');
      if (!rules || !hours) {
        status.classList.remove('closed');
        status.classList.add('loading');
        $('statusDate').textContent = '同步中';
        $('statusLabel').textContent = '正在同步狀態';
        $('statusDetail').textContent = '尚未取得 POS 最新營業設定，請稍候。';
        $('statusTime').textContent = '資料同步中';
        return;
      }
      const now = new Date();
      const todayKey = rules.getTaipeiDateKey(now);
      const current = rules.statusForDate(hours, todayKey, now);
      const schedule = current.hours || {};
      const isOpen = current.kind === 'open-now';
      const isClosed = current.kind.includes('closed') || current.kind === 'weekly-closed' || current.kind === 'special-closed';
      status.classList.remove('loading');
      status.classList.toggle('closed', !isOpen);
      $('statusDate').textContent = formatToday(todayKey);
      $('statusLabel').textContent = current.label;
      $('statusDetail').textContent = schedule.isSpecial ? (schedule.reason || current.detail) : current.detail;
      $('statusTime').textContent = schedule.open ? `營業時間 ${schedule.start} – ${schedule.end}` : (schedule.isSpecial ? '今日特殊店休' : '固定公休');
      if (!isClosed && current.kind === 'not-open-yet') status.classList.remove('closed');
    }

    function renderFlavors(data) {
      const items = Object.values(data || {}).filter(item => item?.name).sort((a, b) => Number(a.sortOrder || 0) - Number(b.sortOrder || 0));
      $('flavorCount').textContent = items.length ? `${items.length} 種口味` : '暫無資料';
      if (!items.length) { $('flavorGrid').innerHTML = '<div class="empty">今天尚未公布口味</div>'; return; }
      $('flavorGrid').innerHTML = items.map(item => {
        const sold = item.soldOut === true;
        return `<article class="flavor-card${sold ? ' sold' : ''}" style="--flavor:${colors[item.name] || '#b98262'}"><div class="flavor-name">${escapeHtml(item.name)}</div>${item.desc ? `<div class="flavor-desc">${escapeHtml(item.desc)}</div>` : ''}${sold ? '<span class="badge">售完</span>' : ''}</article>`;
      }).join('');
    }

    onValue(ref(db, 'todayFlavors'), snap => { renderFlavors(snap.val()); setSync('online', '即時同步'); }, () => { $('flavorGrid').innerHTML = '<div class="empty">目前無法同步，請稍後再試</div>'; setSync('offline', '同步中斷'); });
    onValue(ref(db, 'businessHours'), snap => { window.__businessHours = snap.val() || {}; updateStatus(window.__businessHours); }, () => updateStatus(null));
    onValue(ref(db, 'siteConfig'), snap => { const value = snap.val(); if (!value) return; $('brandTitle').textContent = value.brand?.mainTitle || 'OMG! Gelato'; $('brandSubtitle').textContent = '今日口味・快速查看'; });
    setInterval(() => updateStatus(window.__businessHours || null), 30000);
  </script>
</body>
</html>
