<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2eee7" />
  <title>OMG! Gelato｜今日口味</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js"
      }
    }
  </script>
  <script src="/business-hours-rules.js?v=20261116-2"></script>
  <style>
    :root { --canvas:#f2eee7; --ink:#202c2b; --muted:#7e8984; --paper:#fffefa; --line:#dfe4df; --coral:#ff785f; --mint:#b9d98d; --deep:#213635; --closed:#b75f51; --amber:#c28a42; --sold:#9b9f9a; }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; background:var(--canvas); color:var(--ink); }
    body { padding:18px 14px 28px; font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif; }
    button { font:inherit; }
    .board { width:min(100%, 460px); margin:0 auto; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 2px 18px; }
    .identity { display:flex; align-items:center; gap:10px; min-width:0; }
    .logo { width:34px; height:34px; object-fit:contain; border-radius:12px; background:#fff; box-shadow:0 5px 12px #4f5e5220; }
    .identity-copy { min-width:0; }
    .identity-title { margin:0; color:var(--deep); font-size:14px; font-weight:950; letter-spacing:-.04em; }
    .identity-subtitle { margin:3px 0 0; overflow:hidden; color:var(--muted); font-size:9px; letter-spacing:.03em; text-overflow:ellipsis; white-space:nowrap; }
    .sync { display:inline-flex; align-items:center; gap:5px; color:var(--muted); font-size:9px; font-weight:700; white-space:nowrap; }
    .sync-dot { width:7px; height:7px; border-radius:50%; background:var(--amber); }
    .sync-dot.online { background:#6aa856; box-shadow:0 0 0 4px #6aa8561f; }
    .sync-dot.offline { background:#d56a5c; }
    .masthead { position:relative; min-height:188px; overflow:hidden; padding:23px 22px 20px; border-radius:31px; color:#f6f7ef; background:var(--deep); box-shadow:0 18px 35px #34474429; }
    .masthead::before,.masthead::after { content:""; position:absolute; border-radius:50%; pointer-events:none; }
    .masthead::before { width:230px; height:230px; right:-90px; top:-105px; background:#b9d98d3d; }
    .masthead::after { width:150px; height:150px; right:22px; bottom:-100px; background:#ff785f50; }
    .masthead-kicker { position:relative; z-index:1; margin:0; color:#cce4a4; font-size:9px; font-weight:950; letter-spacing:.22em; }
    .masthead h1 { position:relative; z-index:1; max-width:245px; margin:13px 0 9px; font-size:34px; line-height:.98; letter-spacing:-.1em; }
    .masthead-copy { position:relative; z-index:1; max-width:245px; margin:0; color:#d5dfd7; font-size:11px; line-height:1.6; }
    .orbit { position:absolute; z-index:1; right:25px; bottom:19px; display:grid; place-items:center; width:82px; height:82px; border:1px solid #ffffff33; border-radius:50%; color:#fff5df; font-size:28px; transform:rotate(-12deg); }
    .orbit::after { content:""; position:absolute; width:11px; height:11px; right:-2px; top:5px; border-radius:50%; background:var(--coral); box-shadow:0 0 0 5px #ff785f2b; }
    .status { position:relative; z-index:2; display:block; margin:-27px 13px 20px; padding:13px 15px 14px; border:1px solid #cfe4d2; border-radius:18px; background:#f4fbf0; color:#39734a; box-shadow:0 10px 22px #49634a1a; }
    .status::after { content:""; position:absolute; width:75px; height:75px; right:-26px; top:-32px; border-radius:50%; background:#6aa85617; pointer-events:none; }
    .status.closed { border-color:#eed3ca; background:#fff4ef; color:var(--closed); }
    .status.closed::after { background:#d56a5c1b; }
    .status.loading { border-color:#ead9b4; background:#fff8e9; color:var(--amber); }
    .status.loading::after { background:#e3af551c; }
    .status-top { position:relative; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .status-kicker { display:flex; align-items:center; gap:7px; font-size:10px; font-weight:950; letter-spacing:.12em; }
    .status-dot { width:9px; height:9px; border-radius:50%; background:currentColor; box-shadow:0 0 0 5px #6aa8561c; }
    .status.closed .status-dot { box-shadow:0 0 0 5px #d56a5c1c; }
    .status-main { position:relative; z-index:1; display:block; margin:7px 0 0; color:var(--ink); font-size:20px; font-weight:950; letter-spacing:-.08em; }
    .status-detail,.status-time { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .menu-panel { padding:19px 15px 15px; border:1px solid var(--line); border-radius:26px; background:var(--paper); box-shadow:0 12px 28px #53615a10; }
    .menu-heading { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin:0 2px 15px; }
    .menu-heading p { margin:0 0 5px; color:var(--coral); font-size:9px; font-weight:950; letter-spacing:.2em; }
    .menu-heading h2 { margin:0; color:var(--deep); font-size:23px; letter-spacing:-.09em; }
    .count-pill { flex:none; padding:6px 9px; border-radius:999px; color:var(--deep); background:#eaf2dc; font-size:9px; font-weight:900; }
    .flavor-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .flavor-card { position:relative; min-height:126px; overflow:hidden; padding:15px 13px 13px; border:1px solid #e4e8e2; border-radius:20px; background:#fcfdfa; box-shadow:0 5px 12px #55645c0b; }
    .flavor-card::before { content:""; position:absolute; width:76px; height:76px; right:-22px; top:-24px; border-radius:50%; background:var(--flavor,#d9b19a); opacity:.3; }
    .flavor-card::after { content:""; position:absolute; left:0; top:0; width:6px; height:100%; background:var(--flavor,#d9b19a); }
    .flavor-card.sold { background:#f0f1ee; color:var(--sold); box-shadow:none; }
    .flavor-card.sold::before { background:#b9beb8; opacity:.28; }
    .flavor-card.sold::after { background:#b9beb8; }
    .flavor-name { position:relative; z-index:1; max-width:95px; padding-top:18px; font-size:15px; font-weight:950; line-height:1.18; letter-spacing:-.06em; }
    .flavor-desc { position:relative; z-index:1; max-width:120px; margin-top:7px; color:var(--muted); font-size:10px; line-height:1.45; }
    .flavor-card.sold .flavor-desc { color:#9b9f9a; }
    .badge { position:absolute; z-index:2; top:11px; right:10px; padding:4px 7px; border-radius:999px; color:#727873; background:#dfe2de; font-size:8px; font-weight:900; }
    .empty { grid-column:1/-1; padding:42px 14px; color:var(--muted); text-align:center; font-size:12px; line-height:1.5; }
    .empty::before { content:"✦"; display:block; margin-bottom:8px; color:var(--mint); font-size:25px; }
    .footnote { margin:14px 5px 0; color:var(--muted); font-size:10px; line-height:1.55; text-align:center; }
    .updated { margin-top:6px; color:#a7afa8; font-size:9px; text-align:center; }
    @media (max-width:340px) { body { padding:12px 10px 22px; } .masthead { min-height:178px; padding:20px 18px; } .masthead h1 { font-size:30px; } .orbit { right:18px; width:70px; height:70px; } .status { margin-left:8px; margin-right:8px; } .menu-panel { padding-left:11px; padding-right:11px; } .flavor-card { min-height:116px; padding-left:11px; } }
    @media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <main class="board">
    <header class="topline">
      <div class="identity">
        <img class="logo" src="https://omg-gelato79.pages.dev/logo1.png" alt="OMG! Gelato" onerror="this.style.display='none'" />
        <div class="identity-copy">
          <h2 class="identity-title" id="brandTitle">OMG! Gelato</h2>
          <p class="identity-subtitle" id="brandSubtitle">每日新鮮口味公告</p>
        </div>
      </div>
      <div class="sync"><i class="sync-dot" id="syncDot"></i><span id="syncText">連線中</span></div>
    </header>

    <section class="masthead" aria-label="今日口味主視覺">
      <p class="masthead-kicker">GELATO DAILY BOARD</p>
      <h1>今天，<br />想來哪一球？</h1>
      <p class="masthead-copy">把今天的好心情，交給一球剛剛好的義式冰淇淋。</p>
      <span class="orbit" aria-hidden="true">✦</span>
    </section>

    <section class="status loading" id="shopStatus" aria-live="polite">
      <div class="status-top"><span class="status-kicker"><i class="status-dot"></i>今日營業狀態</span><span class="sync" id="statusDate">—</span></div>
      <strong class="status-main" id="statusLabel">正在同步狀態</strong>
      <p class="status-detail" id="statusDetail">尚未取得 POS 最新營業設定，請稍候。</p>
      <span class="status-time" id="statusTime">資料同步中</span>
    </section>

    <section class="menu-panel" aria-label="今日口味清單">
      <div class="menu-heading">
        <div><p>FLAVORS ON THE COUNTER</p><h2>今日口味</h2></div>
        <span class="count-pill" id="flavorCount">載入中</span>
      </div>
      <div class="flavor-grid" id="flavorGrid"><div class="empty">正在同步今日口味…</div></div>
    </section>

    <p class="footnote">口味與供應數量依店內現場為準<br />想吃的那一球，遇見就別錯過。</p>
    <div class="updated" id="updatedAt">最後同步：—</div>
  </main>

  <script type="module">
    import { initializeApp, getApp, getApps } from 'firebase/app';
    import { getDatabase, ref, onValue } from 'firebase/database';

    const firebaseConfig = {
      apiKey: 'AIzaSyDvzZKr2x3TGeOFZGisKKXjbYH00DLVhKg',
      authDomain: 'omg-menu-5761a.firebaseapp.com',
      databaseURL: 'https://omg-menu-5761a-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'omg-menu-5761a',
      storageBucket: 'omg-menu-5761a.firebasestorage.app',
      messagingSenderId: '193209930119',
      appId: '1:193209930119:web:d9216165be9ef6c0bcc322'
    };
    const db = getDatabase(getApps().length ? getApp() : initializeApp(firebaseConfig));
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const colors = { '開心果':'#8CB872', '草莓':'#E8837A', '巧克力':'#8D7A6D', '芒果':'#F5C542', '抹茶':'#89B87C', '香草':'#F5E6D3', '咖啡':'#B5957A', '檸檬':'#F5E56B', '覆盆子':'#E8707A', '百香果':'#F5B84D', '藍莓':'#7A8FC9', '芋頭牛奶':'#C9A8D0', '烏龍茶':'#A09080', '紅茶':'#C4B0A0', '黑金芝麻':'#4A3A30' };
    const rules = window.GelatoBusinessHours;
    const dayNames = { sun:'星期日', mon:'星期一', tue:'星期二', wed:'星期三', thu:'星期四', fri:'星期五', sat:'星期六' };
    function setSync(state, text) { $('syncDot').className = `sync-dot ${state}`; $('syncText').textContent = text; $('updatedAt').textContent = `最後同步：${new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' })}`; }
    function formatToday(dateKey) {
      const p = rules.taipeiParts(new Date(`${dateKey}T12:00:00+08:00`));
      return `${p.month}月${p.day}日 ${dayNames[p.dayKey] || ''}`;
    }
    function updateStatus(hours) {
      const status = $('shopStatus');
      if (!rules || !hours) {
        status.classList.remove('closed'); status.classList.add('loading');
        $('statusDate').textContent = '同步中'; $('statusLabel').textContent = '正在同步狀態';
        $('statusDetail').textContent = '尚未取得 POS 最新營業設定，請稍候。'; $('statusTime').textContent = '資料同步中';
        return;
      }
      const now = new Date();
      const todayKey = rules.getTaipeiDateKey(now); const tomorrowKey = rules.getTaipeiDateKey(now, 1);
      const current = rules.statusForDate(hours, todayKey, now); const tomorrow = rules.statusForDate(hours, tomorrowKey, now);
      const schedule = current.hours || {}; const tomorrowSchedule = tomorrow.hours || {};
      const isOpen = current.kind === 'open-now'; const tomorrowAvailable = tomorrowSchedule.open === true;
      const tomorrowText = tomorrowAvailable ? '仍可預約明天取餐' : '明天也沒有可預約時段';
      let label = current.label; let detail = current.detail;
      let time = schedule.open ? `營業時間 ${schedule.start} – ${schedule.end}` : (tomorrowAvailable ? `明日營業 ${tomorrowSchedule.start} – ${tomorrowSchedule.end}` : '近期無可預約時段');
      if (current.kind === 'weekly-closed') { label = '今日店休'; detail = `目前未營業，${tomorrowText}`; }
      else if (current.kind === 'special-closed') { label = '臨時店休'; detail = `${schedule.reason || '今日臨時店休'}，${tomorrowText}`; }
      else if (current.kind === 'closed-for-today') { label = '今日已打烊'; detail = `目前未營業，${tomorrowText}`; }
      else if (current.kind === 'not-open-yet') { label = '尚未營業'; detail = `目前未營業，今天 ${schedule.start} 開始營業`; }
      else if (current.kind === 'open-now') { label = schedule.isSpecial ? '特別營業中' : '今日營業中'; detail = `目前營業中，營業至 ${schedule.end}`; }
      status.classList.remove('loading'); status.classList.toggle('closed', !isOpen);
      $('statusDate').textContent = formatToday(todayKey); $('statusLabel').textContent = label;
      $('statusDetail').textContent = detail; $('statusTime').textContent = time;
    }
    function renderFlavors(data) {
      const items = Object.values(data || {}).filter(item => item?.name).sort((a, b) => Number(a.sortOrder || 0) - Number(b.sortOrder || 0));
      $('flavorCount').textContent = items.length ? `${items.length} 種口味` : '尚未公布';
      if (!items.length) { $('flavorGrid').innerHTML = '<div class="empty">今日口味還沒公布</div>'; return; }
      $('flavorGrid').innerHTML = items.map(item => {
        const sold = item.soldOut === true;
        return `<article class="flavor-card${sold ? ' sold' : ''}" style="--flavor:${colors[item.name] || '#b98262'}"><div class="flavor-name">${escapeHtml(item.name)}</div>${item.desc ? `<div class="flavor-desc">${escapeHtml(item.desc)}</div>` : ''}${sold ? '<span class="badge">售完</span>' : ''}</article>`;
      }).join('');
    }
    onValue(ref(db, 'todayFlavors'), snap => { renderFlavors(snap.val()); setSync('online', '即時同步'); }, () => { $('flavorGrid').innerHTML = '<div class="empty">目前無法同步，請稍後再試</div>'; setSync('offline', '同步中斷'); });
    onValue(ref(db, 'businessHours'), snap => { window.__businessHours = snap.val() || {}; updateStatus(window.__businessHours); }, () => updateStatus(null));
    onValue(ref(db, 'siteConfig'), snap => { const value = snap.val(); if (!value) return; $('brandTitle').textContent = value.brand?.mainTitle || 'OMG! Gelato'; $('brandSubtitle').textContent = '每日新鮮口味公告'; });
    setInterval(() => updateStatus(window.__businessHours || null), 30000);
  </script>
</body>
</html>
