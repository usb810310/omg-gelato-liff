<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OMG! Gelato 今日口味</title>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js",
        "firebase/database": "https://www.gstatic.com/firebasejs/11.0.0/firebase-database.js"
      }
    }
  </script>
  <style>
    :root {
      --bg: #fbf8f5;
      --card: #ffffff;
      --ink: #30251f;
      --muted: #8b7c71;
      --line: #eee5de;
      --accent: #b98262;
      --ok-bg: #edf7ee;
      --ok: #39734a;
      --closed-bg: #fff2eb;
      --closed: #9a5a45;
      --sold-bg: #f1eeeb;
      --sold: #9a8e85;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
    body { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", sans-serif; padding: 9px 9px 14px; }
    .shell { width: min(100%, 420px); margin: 0 auto; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .logo { width: 32px; height: 32px; object-fit: contain; border-radius: 10px; background: #fff; box-shadow: 0 3px 12px rgba(79, 55, 39, .08); }
    .brand-copy { min-width: 0; }
    .brand-title { margin: 0; font-size: 15px; line-height: 1.1; letter-spacing: .3px; white-space: nowrap; }
    .brand-subtitle { margin-top: 2px; color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sync { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 10px; white-space: nowrap; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #e3af55; }
    .sync-dot.online { background: #4fa563; box-shadow: 0 0 0 3px rgba(79,165,99,.12); }
    .sync-dot.offline { background: #d66b59; }
    .status { display: flex; align-items: flex-start; gap: 7px; padding: 7px 9px; border: 1px solid #dcebdd; border-radius: 11px; background: var(--ok-bg); color: var(--ok); }
    .status.closed { border-color: #f0d8ca; background: var(--closed-bg); color: var(--closed); }
    .status-dot { width: 8px; height: 8px; flex: none; margin-top: 4px; border-radius: 50%; background: currentColor; }
    .status strong { display: block; font-size: 11px; line-height: 1.2; }
    .status small { display: block; margin-top: 2px; font-size: 9px; opacity: .85; line-height: 1.2; }
    .section { margin-top: 9px; padding: 10px 8px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); box-shadow: 0 5px 16px rgba(73, 48, 32, .045); }
    .section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .section-head h2 { margin: 0; font-size: 12px; letter-spacing: .2px; }
    .section-head span { color: var(--muted); font-size: 9px; }
    .flavor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
    .flavor-card { position: relative; min-height: 47px; padding: 8px 5px 7px 8px; overflow: hidden; border: 1px solid var(--line); border-radius: 9px; background: #fffdfb; }
    .flavor-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--flavor, var(--accent)); }
    .flavor-card.sold { background: var(--sold-bg); color: var(--sold); }
    .flavor-card.sold::before { background: #c9c0b9; }
    .flavor-name { padding-left: 3px; padding-right: 2px; font-size: 11px; font-weight: 750; line-height: 1.15; }
    .flavor-desc { display: none; }
    .badge { position: absolute; top: 4px; right: 4px; padding: 1px 3px; border-radius: 999px; background: rgba(255,255,255,.9); color: var(--accent); font-size: 8px; font-weight: 700; }
    .sold .badge { background: #e5dfda; color: var(--sold); }
    .empty { grid-column: 1 / -1; padding: 18px 8px; color: var(--muted); text-align: center; font-size: 12px; }
    .note { margin: 7px 3px 0; color: var(--muted); font-size: 9px; line-height: 1.3; text-align: center; }
    .updated { margin-top: 5px; color: #aa9b90; font-size: 8px; text-align: center; }
    @media (max-width: 330px) {
      body { padding: 11px 9px 16px; }
      .flavor-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .brand-title { font-size: 14px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img class="logo" src="https://omg-gelato79.pages.dev/logo1.png" alt="OMG! Gelato" onerror="this.style.display='none'" />
        <div class="brand-copy">
          <h1 class="brand-title" id="brandTitle">OMG! Gelato</h1>
          <div class="brand-subtitle" id="brandSubtitle">今日口味・快速查看</div>
        </div>
      </div>
      <div class="sync"><i class="sync-dot" id="syncDot"></i><span id="syncText">連線中</span></div>
    </header>

    <section class="status" id="shopStatus">
      <i class="status-dot"></i>
      <div><strong id="statusLabel">確認營業狀態中…</strong><small id="statusDetail"></small></div>
    </section>

    <section class="section">
      <div class="section-head"><h2>今天有哪些口味？</h2><span id="flavorCount">載入中</span></div>
      <div class="flavor-grid" id="flavorGrid"><div class="empty">正在同步今日口味…</div></div>
    </section>

    <p class="note">口味與供應數量會依店內現場為準</p>
    <div class="updated" id="updatedAt">最後同步：—</div>
  </main>

  <script type="module">
    import { initializeApp, getApp, getApps } from 'firebase/app';
    import { getDatabase, ref, onValue } from 'firebase/database';

    const firebaseConfig = {
      apiKey: 'AIzaSyDvzZKr2x3TGeOFZGisKKXjbYH00DLVhKg',
      authDomain: 'omg-menu-5761a.firebaseapp.com',
      databaseURL: 'https://omg-menu-5761a-default-rtdb.asia-southeast1.firebasedatabase.app',
      projectId: 'omg-menu-5761a',
      storageBucket: 'omg-menu-5761a.firebasestorage.app',
      messagingSenderId: '193209930119',
      appId: '1:193209930119:web:d9216165be9ef6c0bcc322'
    };
    const db = getDatabase(getApps().length ? getApp() : initializeApp(firebaseConfig));
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    const colors = { '開心果':'#8CB872', '草莓':'#E8837A', '巧克力':'#8D7A6D', '芒果':'#F5C542', '抹茶':'#89B87C', '香草':'#F5E6D3', '咖啡':'#B5957A', '檸檬':'#F5E56B', '覆盆子':'#E8707A', '百香果':'#F5B84D', '藍莓':'#7A8FC9', '芋頭牛奶':'#C9A8D0', '烏龍茶':'#A09080', '紅茶':'#C4B0A0', '黑金芝麻':'#4A3A30' };
    const defaultHours = { open: true, start: '13:00', end: '20:00' };
    const dayKey = (date) => new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Taipei', weekday:'short' }).format(date).toLowerCase().slice(0, 3);
    const minutes = (date) => { const p = new Intl.DateTimeFormat('en-US', { timeZone:'Asia/Taipei', hour:'2-digit', minute:'2-digit', hourCycle:'h23' }).formatToParts(date); return Number(p.find(x => x.type === 'hour')?.value || 0) * 60 + Number(p.find(x => x.type === 'minute')?.value || 0); };
    const toMinutes = (v) => { const [h, m] = String(v || '0:0').split(':').map(Number); return h * 60 + m; };

    function setSync(state, text) { $('syncDot').className = `sync-dot ${state}`; $('syncText').textContent = text; $('updatedAt').textContent = `最後同步：${new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' })}`; }
    function updateStatus(hours) {
      const status = $('shopStatus');
      if (!hours) { status.classList.remove('closed'); $('statusLabel').textContent = '營業狀態請以店內公告為準'; $('statusDetail').textContent = ''; return; }
      const mode = hours.shopMode || (hours.shopClosed ? 'off' : 'auto');
      const today = { ...defaultHours, ...(hours[dayKey(new Date())] || {}) };
      const open = mode === 'open' || (mode !== 'off' && today.open && minutes(new Date()) >= toMinutes(today.start) && minutes(new Date()) < toMinutes(today.end));
      status.classList.toggle('closed', !open);
      $('statusLabel').textContent = open ? '目前營業中' : '目前非營業時間';
      $('statusDetail').textContent = mode === 'off' ? '店休中，仍可查看今日口味' : `營業時間 ${today.start} – ${today.end}`;
    }

    function renderFlavors(data) {
      const items = Object.values(data || {}).filter(item => item?.name).sort((a, b) => Number(a.sortOrder || 0) - Number(b.sortOrder || 0));
      $('flavorCount').textContent = items.length ? `${items.length} 種口味` : '暫無資料';
      if (!items.length) { $('flavorGrid').innerHTML = '<div class="empty">今天尚未公布口味</div>'; return; }
      $('flavorGrid').innerHTML = items.map(item => {
        const sold = item.soldOut === true;
        return `<article class="flavor-card${sold ? ' sold' : ''}" style="--flavor:${colors[item.name] || '#b98262'}"><div class="flavor-name">${escapeHtml(item.name)}</div>${item.desc ? `<div class="flavor-desc">${escapeHtml(item.desc)}</div>` : ''}${sold ? '<span class="badge">售完</span>' : ''}</article>`;
      }).join('');
    }

    onValue(ref(db, 'todayFlavors'), snap => { renderFlavors(snap.val()); setSync('online', '即時同步'); }, () => { $('flavorGrid').innerHTML = '<div class="empty">目前無法同步，請稍後再試</div>'; setSync('offline', '同步中斷'); });
    onValue(ref(db, 'businessHours'), snap => updateStatus(snap.val()));
    onValue(ref(db, 'siteConfig'), snap => { const value = snap.val(); if (!value) return; $('brandTitle').textContent = value.brand?.mainTitle || 'OMG! Gelato'; $('brandSubtitle').textContent = '今日口味・快速查看'; });
    setInterval(() => onValue(ref(db, 'businessHours'), snap => updateStatus(snap.val()), { onlyOnce: true }), 30000);
  </script>
</body>
</html>
